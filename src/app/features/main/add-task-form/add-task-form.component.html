<div class="add-task-form-left">
    <div class="add-task-form-input-container">
        <label for="title">Title<span>*</span></label>
        <input type="text" id="title" class="input input-padding-size5" [(ngModel)]="taskData.title">
    </div>
    <div class="add-task-form-input-container">
        <label for="description">Description</label>
        <textarea name="description" id="description" class="input" [(ngModel)]="taskData.description"></textarea>
    </div>
    <div class="add-task-form-input-container">
        <label for="date">Due date</label>
        <input type="date" id="date" class="input input-padding-size4" [(ngModel)]="taskData.dueDate">
    </div>
</div>
<div class="add-task-form-separator"></div>
<div class="add-task-form-right">
    <div class="add-task-form-input-container">
        <label>Priority</label>
        <div class="add-task-form-buttons-container">
            <button class="priority-btn" (click)="clickPriorityButton('Urgent')" [ngClass]="taskData.priority == 'Urgent' ? 'urgent-active' : 'urgent-inactive'">Urgent<span class="material-symbols-rounded priority-btn-icon">double_arrow</span></button>
            <button class="priority-btn" (click)="clickPriorityButton('Medium')" [ngClass]="taskData.priority == 'Medium' ? 'medium-active' : 'medium-inactive'">Medium<span class="material-symbols-rounded priority-btn-icon">equal</span></button>
            <button class="priority-btn" (click)="clickPriorityButton('Low')" [ngClass]="taskData.priority == 'Low' ? 'low-active' : 'low-inactive'">Low<span class="material-symbols-rounded priority-btn-icon">double_arrow</span></button>
        </div>
    </div>
    <div class="add-task-form-input-container">
        <label for="assigned-to">Assigned</label>
        <select name="assigned-to" id="assigned-to" class="input input-padding-size4">
            <option value="" disabled selected hidden>Select contacts to assign</option>
        </select>
    </div>
    <div class="add-task-form-input-container">
        <select name="category" id="category" class="input input-padding-size4" [(ngModel)]="taskData.category">
            <option value="" disabled selected hidden>Select task category</option>
            <option value="User Story">User Story</option>
            <option value="Technical Task">Technical Task</option>
        </select>
    </div>
    <div class="add-task-form-input-container">
        <input type="text" name="subtask" id="subtask" placeholder="Add new subtask" class="input input-padding-size4">
        @if (taskData.subtasks.length > 0) {
            <ul>
            @for (subtask of taskData.subtasks; track $index) {
                <li>{{ subtask.title }}
                <div class="subtask-preview-buttons">
                    <button class="btn-transparent material-symbols-rounded">edit</button>
                    <div class="subtask-preview-buttons-separator"></div>
                    <button class="btn-transparent material-symbols-rounded">delete</button>
                </div>
                </li>
            }
            </ul>
        }
    </div>
</div>
