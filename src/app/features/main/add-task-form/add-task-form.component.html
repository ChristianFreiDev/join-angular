<div class="add-task-form-left">
    <div class="add-task-form-input-container">
        <label for="title">Title<span>*</span></label>
        <input type="text" id="title" class="input input-padding-size5">
    </div>
    <div class="add-task-form-input-container">
        <label for="description">Description</label>
        <textarea name="description" id="description" class="input"></textarea>
    </div>
    <div class="add-task-form-input-container">
        <label for="date">Due date</label>
        <input type="date" id="date" class="input input-padding-size4">
    </div>
</div>
<div class="add-task-form-separator"></div>
<div class="add-task-form-right">
    <div class="add-task-form-input-container">
        <label>Priority</label>
        <div class="add-task-form-buttons-container">
            <button class="priority-btn" (click)="clickPriorityButton('urgent')" [ngClass]="urgency == 'urgent' ? 'urgent-active' : 'urgent-inactive'">Urgent<span class="material-symbols-rounded priority-btn-icon">double_arrow</span></button>
            <button class="priority-btn" (click)="clickPriorityButton('medium')" [ngClass]="urgency == 'medium' ? 'medium-active' : 'medium-inactive'">Medium<span class="material-symbols-rounded priority-btn-icon">equal</span></button>
            <button class="priority-btn" (click)="clickPriorityButton('low')" [ngClass]="urgency == 'low' ? 'low-active' : 'low-inactive'">Low<span class="material-symbols-rounded priority-btn-icon">double_arrow</span></button>
        </div>
    </div>
    <div class="add-task-form-input-container">
        <label for="assigned-to">Assigned</label>
        <select name="assigned-to" id="assigned-to" class="input input-padding-size4">
            <option value="" disabled selected hidden>Select contacts to assign</option>
        </select>
    </div>
    <div class="add-task-form-input-container">
        <select name="category" id="category" class="input input-padding-size4">
            <option value="" disabled selected hidden>Select task category</option>
        </select>
    </div>
    <div class="add-task-form-input-container">
        <input type="text" name="subtask" id="subtask" placeholder="Add new subtask" class="input input-padding-size4">
    </div>
</div>
