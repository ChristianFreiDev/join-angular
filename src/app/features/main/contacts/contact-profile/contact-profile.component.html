<div class="contact-profile-header">
  <div
    class="initial-avatar initial-avatar-largest"
    [ngClass]="contact()?.color"
  >
    {{ initials() }}
  </div>
  <div class="contact-profile-header-right">
    <div class="contact-profile-name break-word">{{ contact()?.name }}</div>
    <div class="contact-profile-buttons-container">
      <button class="btn-transparent" (click)="editContact()">
        <span class="material-symbols-rounded">edit</span>
        <span>Edit</span>
      </button>
      <button class="btn-transparent" (click)="deleteContact()">
        <span class="material-symbols-rounded">delete</span>
        <span>Delete</span>
      </button>
    </div>
  </div>
</div>
<div class="contact-profile-information">Contact information</div>
<div class="contact-profile-bottom-container">
  <div class="contact-profile-email-container">
    <span>Email</span>
    <a class="email" [href]="'mailto:' + contact()?.email">{{
      contact()?.email
    }}</a>
  </div>
  <div class="contact-profile-phone-container">
    <span>Phone</span>
    <span class="phone">{{ contact()?.phone }}</span>
  </div>
</div>
<button
  id="contact-profile-more-btn" 
  class="btn btn-dark contact-options-btn"
  (click)="$event.stopPropagation(); isMoreMenuActive = true"
>
  <span class="material-symbols-rounded">more_vert</span>
</button>
<div
  class="contact-profile-more-menu"
  [class.contact-profile-more-menu-active]="isMoreMenuActive"
  appClickOutside
  [elementId]="'contact-profile-more-btn'"
  (clickOutsideEvent)="isMoreMenuActive = false"
>
  <button (click)="editContact()">
    <span class="material-symbols-rounded">edit</span><span>Edit</span>
  </button>
  <button (click)="deleteContact()">
    <span class="material-symbols-rounded">delete</span><span>Delete</span>
  </button>
</div>
