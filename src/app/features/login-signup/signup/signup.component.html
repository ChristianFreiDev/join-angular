<div class="login-signup-form-header">
  <a class="material-symbols-rounded back-link signup-back-link" routerLink="/login">arrow_back</a>
  <h2 class="login-signup-headline">Sign up</h2>
  <div class="login-signup-separator"></div>
</div>
<form #signupForm="ngForm" (ngSubmit)="onSubmit(signupForm)" ngNativeValidate>
  <div class="input-container">
    <input
      [(ngModel)]="formData.name"
      name="name"
      class="input input-padding-size4"
      type="text"
      placeholder="Name"
      minlength="4"
      required
    />
    <span class="material-symbols-rounded input-icon">person</span>
  </div>
  <div class="input-container mt-24">
    <input
      [(ngModel)]="formData.email"
      name="email"
      class="input input-padding-size4"
      type="email"
      placeholder="E-mail"
      minlength="6"
      required
    />
    <span class="material-symbols-rounded input-icon">mail</span>
  </div>
  <div class="input-container mt-24">
    <input
      [(ngModel)]="formData.password"
      name="password"
      class="input input-padding-size4"
      type="password"
      placeholder="Password"
      minlength="8"
      required
    />
    <span class="material-symbols-rounded input-icon">lock</span>
  </div>
  <div class="input-container mt-24">
    <input
      [(ngModel)]="formData.passwordForConfirmation"
      name="passwordForConfirmation"
      class="input input-padding-size4"
      type="password"
      placeholder="Confirm password"
      minlength="8"
      required
    />
    <span class="material-symbols-rounded input-icon">lock</span>
  </div>
  <div class="error">
    @if (isError) { Check your email and password. Please&nbsp;try&nbsp;again. }
    @else { &#8203; }
  </div>
    <div class="signup-checkbox-outer-container">
      <div class="checkbox-inner-container" (click)="clickCheckbox()">
        <span class="material-symbols-rounded login-checkbox-symbol">{{
          checkboxSymbolName()
        }}</span>
        <input #privacyPolicyCheckbox class="checkbox-input" type="checkbox" required />
      </div>
      <div class="privacy-policy-message">
      I accept the <a routerLink="/privacy-policy" target="_blank" class="accent-color-link">privacy policy</a>
      </div>
    </div>
  <div class="login-signup-btn-container mt-32">
    <button class="btn btn-dark main-button btn-padding-size4">Sign up</button>
  </div>
</form>
